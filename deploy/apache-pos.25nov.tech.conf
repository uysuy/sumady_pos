# First-time Hostinger / VPS — Apache reverse proxy (same idea as app.25nov.tech → Node).
# Requires: sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#
# Install:
#   sudo cp deploy/apache-pos.25nov.tech.conf /etc/apache2/sites-available/pos.25nov.tech.conf
#   sudo a2ensite pos.25nov.tech
#   sudo apache2ctl configtest && sudo systemctl reload apache2
# TLS:
#   sudo certbot --apache -d pos.25nov.tech

<VirtualHost *:80>
	ServerName pos.25nov.tech

	ProxyPreserveHost On
	RequestHeader set X-Forwarded-Proto "http"
	ProxyPass        / http://127.0.0.1:4003/
	ProxyPassReverse / http://127.0.0.1:4003/

	ErrorLog ${APACHE_LOG_DIR}/pos.25nov.tech-error.log
	CustomLog ${APACHE_LOG_DIR}/pos.25nov.tech-access.log combined
</VirtualHost>

# After certbot, certbot usually adds a *:443 vhost. If you prefer manual SSL
# (copy paths from app.25nov.tech), use something like:
#
# <VirtualHost *:443>
# 	ServerName pos.25nov.tech
