# First-time Hostinger / VPS — same pattern as sumady-test (app.25nov.tech → :4002).
# Install:
#   sudo cp deploy/nginx-pos.25nov.tech.conf /etc/nginx/sites-available/pos.25nov.tech
#   sudo ln -sf /etc/nginx/sites-available/pos.25nov.tech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS (if not already covered by Cloudflare Flexible / existing certs):
#   sudo certbot --nginx -d pos.25nov.tech

server {
	listen 80;
	listen [::]:80;
	server_name pos.25nov.tech;

	# If Cloudflare is Full (strict) and certbot already issued a cert, prefer the
	# HTTPS server block below and redirect here instead.
	location / {
		proxy_pass http://127.0.0.1:4003;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_read_timeout 120s;
	}
}

